[package]
name = "auth-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing-subscriber = "0.3"

log = "0.4"
anyhow = "1.0"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }

kube = { version = "0.97", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"
serde_json = "1.0"
hudsucker = "0.23"
regorus = "0.2"
bytes = "1.9"
hyper-util = "0.1"
axum = "0.7"

tokio = { version = "1.41", features = ["macros", "rt", "rt-multi-thread"] }
hyper = "1.5"
headers = "0.4"
http-body-util = "0.1"
crossbeam-skiplist = "0.1"
lazy_static = "1.5"
http = "1.1"
form_urlencoded = "1.2"
once_cell = "1.20.2"
