[package]
name = "auth-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = "0.3"
log = "0.4"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
thiserror = "2.0"

once_cell = "1.20"
crossbeam-skiplist = "0.1"
lazy_static = "1.5"
regorus = "0.2"

kube = { version = "0.97", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"

hudsucker = "0.23"
axum = "0.7"

hyper-util = "0.1"
tokio = { version = "1.41", features = ["macros", "rt", "rt-multi-thread"] }
hyper = "1.5"
http-body-util = "0.1"
bytes = "1.9"
headers = "0.4"
http = "1.1"
form_urlencoded = "1.2"
http-body = "1.0.1"
rustls = { version = "0.23", features = ["ring"] }
serde_yaml = "0.9"
