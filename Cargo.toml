[package]
name = "auth-bridge"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
futures = "0.3"
headers = "0.4"
http = "1.4"
http-body-util = "0.1"
k8s-openapi = { version = "0.26", features = ["latest", "schemars"] }
kube = { version = "2.0", features = ["derive", "runtime"] }
log = "0.4"
once_cell = "1.21"
rama = { git = "https://github.com/plabayo/rama.git", branch = "main", features = ["http", "http-full", "tls", "boring"] }
regorus = "0.5"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "0.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

