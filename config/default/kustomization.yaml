# Adds namespace to all resources.
namespace: auth-bridge

resources:
  - ../deploy
  - ../rbac
  - ../certificate
  - ../crd

vars:
  - name: FORWARD_PROXY
    objref:
      kind: Service
      version: v1
      name: forward-proxy
  - name: REVERSE_PROXY
    objref:
      kind: Service
      version: v1
      name: reverse-proxy