apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    control-plane: proxy
  name: proxy
  namespace: auth-bridge
spec:
  duration: 87600h0m0s
  renewBefore: 720h0m0s
  dnsNames:
    - forward-proxy.auth-bridge.svc
    - forward-proxy.auth-bridge.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: proxy
  privateKey:
    size: 2048
    encoding: PKCS8
  subject:
    organizations:
      - auth-bridge
  isCA: true
  secretName: proxy-cert
