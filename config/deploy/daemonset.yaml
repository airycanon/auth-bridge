apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: auth-bridge
  name: proxy
  labels:
    control-plane: proxy
spec:
  selector:
    matchLabels:
      control-plane: proxy
  template:
    metadata:
      labels:
        control-plane: proxy
    spec:
      containers:
        - image: auth-bridge:latest
          name: forward-proxy
          command:
            - auth-bridge
            - forward-proxy
          args:
            - --ca-key=/certs/tls.key
            - --ca-cert=/certs/tls.crt
          env:
            - name: RUST_LOG
              value: debug
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: cert
              mountPath: /certs
        - image: auth-bridge:latest
          name: reverse-proxy
          command:
            - auth-bridge
            - reverse-proxy
          env:
            - name: RUST_LOG
              value: debug
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
      serviceAccountName: auth-bridge
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: proxy-cert