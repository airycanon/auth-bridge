apiVersion: v1
kind: Pod
metadata:
  name: test-client
spec:
  containers:
    - name: test-client
      image: nicolaka/netshoot
      command:
        - sleep
        - "3600"
      env:
        - name: HTTP_PROXY
          value: http://forward-proxy.auth-bridge:80
        - name: HTTPS_PROXY
          value: http://forward-proxy.auth-bridge:80
